; cassia（桌面版）的进程编排。
;
; 以 `user` 身份跑（E2B 在模板末尾自动追加 USER user），所以所有可写路径
; 都在 /home/user 下 —— /var/run、/var/log 都没有权限。
;
; 启动顺序靠 priority：X 服务器必须先于任何需要 DISPLAY 的进程起来。
; 但 priority 只保证「开始启动」的先后，不保证「已经就绪」——
; 所以 x11vnc 和 chromium 各自带了等待逻辑，见 bin/ 下的包装脚本。

[supervisord]
nodaemon=true
logfile=/home/user/.supervisor/supervisord.log
pidfile=/home/user/.supervisor/supervisord.pid
childlogdir=/home/user/.supervisor
loglevel=info

[unix_http_server]
file=/home/user/.supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/user/.supervisor/supervisor.sock

; ── 画面栈 ────────────────────────────────────────────────────────────

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_SCREEN_GEOMETRY)s -ac -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/home/user/.supervisor/xvfb.log
redirect_stderr=true

[program:openbox]
; 没有窗口管理器的话 Chromium 起来是个无边框、不响应最大化的裸窗口，
; 而且弹窗会盖在主窗口后面 —— 用户在画面里看到的就是「卡住了」。
command=/opt/cassia-desktop/bin/wait-x.sh /usr/bin/openbox
priority=20
autorestart=true
stdout_logfile=/home/user/.supervisor/openbox.log
redirect_stderr=true

[program:x11vnc]
command=/opt/cassia-desktop/bin/wait-x.sh /usr/bin/x11vnc -display :1 -forever -shared -nopw -rfbport 5900 -noxdamage -quiet
priority=30
autorestart=true
stdout_logfile=/home/user/.supervisor/x11vnc.log
redirect_stderr=true

[program:websockify]
; 浏览器直连这个端口看画面，控制面不中转视频流。
command=/usr/bin/websockify --heartbeat 30 5901 localhost:5900
priority=40
autorestart=true
stdout_logfile=/home/user/.supervisor/websockify.log
redirect_stderr=true

[program:chromium]
; 常驻一个真浏览器，而不是每次任务新开一个 —— 用户切到「画面」tab
; 时应该立刻看到东西，不是一片黑等着 Agent 去启动它。
; Agent 通过 CDP(9222) 接管这个实例，操作就直接显示在画面上。
command=/opt/cassia-desktop/bin/chromium.sh
priority=50
autorestart=true
stdout_logfile=/home/user/.supervisor/chromium.log
redirect_stderr=true

; ── Agent ─────────────────────────────────────────────────────────────

[program:agent-runtime]
; node 官方镜像装在 /usr/local/bin，不是 /usr/bin —— 写错的话 supervisord
; 只会打一行 spawnerr 然后 FATAL，桌面栈照样全绿，看起来像是「起来了」。
; Dockerfile 里有一条构建期断言盯着这个路径。
command=/usr/local/bin/node /opt/cassia/runtime/index.js
directory=/home/user
priority=60
autorestart=true
stdout_logfile=/home/user/.supervisor/agent-runtime.log
redirect_stderr=true
